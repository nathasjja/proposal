*{box-sizing:border-box}html,body{margin:0;height:100%;background:#15130F;color:#E6DCC3;font:15px/1.5 Syne,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.line{position:absolute;left:0;right:0;top:50%;height:1px;background:#4FB8A0;opacity:.35}
.card{position:relative;background:#15130F;padding:34px 36px;width:min(380px,100%);display:flex;flex-direction:column;gap:18px}
.mark{display:flex;align-items:center;gap:12px}.logo{display:block;flex:none}

.lbl{letter-spacing:.14em}
input[type=password]{width:100%;background:#2A2722;border:1px solid #3A362F;border-radius:4px;color:#E6DCC3;padding:11px 12px;font:15px "IBM Plex Mono",monospace;outline:none}
input[type=password]:focus{border-color:#4FB8A0;box-shadow:0 0 0 3px rgba(79,184,160,.15)}
label.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:#A39A88;cursor:pointer}label.rem input{accent-color:#4FB8A0}
button{background:#4FB8A0;color:#15130F;border:0;border-radius:999px;padding:11px 20px;font:700 14px Syne,sans-serif;cursor:pointer;align-self:flex-start}
button:disabled{opacity:.6;cursor:wait}
.err{font-family:"IBM Plex Mono",monospace;font-size:12px;color:#E2A63B;min-height:18px}
</style>

function d64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function e64(u){var s="";for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
var KEY="kpb_key";
async function derive(pw){var m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(P.s),iterations:P.n,hash:"SHA-256"},m,{name:"AES-GCM",length:256},true,["decrypt"])}
async function open(key,remember){
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(P.i)},key,d64(P.c));
 var html=new TextDecoder().decode(pt);
 if(remember){try{var raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));localStorage.setItem(KEY,JSON.stringify({s:P.s,k:e64(raw)}))}catch(e){}}
 window.__APP_SRC=html;try{sessionStorage.setItem("kpb_src",html)}catch(e){}
 document.open();document.write(html);document.close();
}
(async function(){try{var st=JSON.parse(localStorage.getItem(KEY)||"null");if(st&&st.s===P.s){var k=await crypto.subtle.importKey("raw",d64(st.k),{name:"AES-GCM"},true,["decrypt"]);await open(k,false)}}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}})();

 try{var k=await derive(document.getElementById("pw").value);await open(k,document.getElementById("rem").checked)}

});
